<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>OECD GIR Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            color: #999;
        }
        .drop-zone:hover {
            border-color: #aaa;
            color: #666;
        }
        .drop-zone .warning {
            font-size: 0.8em;
            margin-top: 10px;
            color: #bbb;
        }
    </style>
</head>
<body>
<div id="drop" class="drop-zone">
    Drop OECD GIR XML file here
    <div class="warning">
        Warning: Never upload sensitive or confidential data to
        a site of a random dude on the internet. This viewer does not store
        or transmit your data, but no guarantees can be made about security.
        Use at your own risk.
    </div>
</div>
<div id="output"></div>

<script>
const xslUrl = "oecd-globe-style.xsl";

document.getElementById("drop").addEventListener("dragover", e => {
  e.preventDefault();
});

document.getElementById("drop").addEventListener("drop", async e => {
  e.preventDefault();

  const file = e.dataTransfer.files[0];
  const xmlText = await file.text();

  const xml = new DOMParser().parseFromString(xmlText, "application/xml");

  const xslText = await fetch(xslUrl).then(r => r.text());
  const xsl = new DOMParser().parseFromString(xslText, "application/xml");

  const processor = new XSLTProcessor();
  processor.importStylesheet(xsl);

  const result = processor.transformToFragment(xml, document);

  const output = document.getElementById("output");
  output.innerHTML = "";
  output.appendChild(result);
});
</script>

</body>
</html>
