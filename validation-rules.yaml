severe_record_errors:
  - number: "60001"
    path_target: "MessageSpec/MessageRefld"
    element_name: "MessageRefld"
    validation_rule: "The MessageRefld must be in the correct format: [CountryCode of the sending jurisdiction] [Reporting Period] [CountryCode of the receiving jurisdiction] [UniqueID]"
    validation_description: "The structure of the Message Refld is not in the correct format. Please ensure the MessageRefID follows structure defined in the GIR User Guide, and resubmit the file."

  - number: "60002"
    path_target: "MessageSpec/MessageRefld"
    element_name: "MessageRefld"
    validation_rule: "The GIR Message Header has a duplicate Message RefID value that was received on a previous file."
    validation_description: "Please replace the Message RefID field value with a new unique value (not containing all blanks), and resubmit the file."

  - number: "60003"
    path_target: "MessageSpec/ReportingPeriod"
    element_name: "Reporting Period"
    validation_rule: "The Reporting Period YYYY value must be less than or equal to current year"
    validation_description: "Reporting period year must be less than or equal to current year."

  - number: "60004"
    path_target: "//DocTypeIndic"
    element_name: "DocTypeIndic"
    validation_rule: "A message can contain either new records (OECD1) or corrections (OECD2 or OECD3), but should not contain a mixture of both."
    validation_description: "This message contains a mix of new records (OECD1) and corrections (OECD2/OECD3). Please ensure the DocTypeIndic elements contain either new records (OECD1) or corrections (OECD2 or OECD3), but not a mixture of both."

  - number: "60005"
    path_target: ".//DocTypeIndic"
    element_name: "DocTypeIndic"
    validation_rule: "When DocTypeIndic is OECD2 or OECD3, the record must concern the same sub section (FilingInfo, General section, Summary, JuridictionSection or UTPRAttribution) as the CorrDocRefld."
    validation_description: "The correction or deletion refers to a record of an other sub section."

  - number: "60006"
    path_target: "//CorrDocReflD"
    element_name: "CorrDocRefld"
    validation_rule: "The same DocReflD cannot be corrected or deleted twice in the same message."
    validation_description: "The same DocRefID cannot be corrected or deleted twice in the same message, therefore each CorrDocRefID must be unique within the same message."

  - number: "60007"
    path_target: "//DocRefld"
    element_name: "DocRefld"
    validation_rule: "The DocRefID is already used for another record."
    validation_description: "The provided DocRefID has already been used for a pre-existing record, please relodge and ensure that the provided DocRefID is in accordance with the OECD GIR XML Schema User Guide and is 'unique in time and space'."

  - number: "60008"
    path_target: ".//CorrDocRefID"
    element_name: "CorrDocRefld"
    validation_rule: "The CorrDocRefid refers to an unknown record."
    validation_description: "The CorrDocRefld provided does not match to an existing record of a DocRefld, please relodge the file and ensure that the CorrDocRefld is an exact match to the DocRefld of the element which is subject to a correction"

  - number: "60009"
    path_target: "//CorrDocRefld"
    element_name: "CorrDocRefld"
    validation_rule: "The CorrDocRefID must relate to the latest instance of the DocRefID. The CorrDocRefID cannot reference an invalidated or outdated version of the DocRefID (i.e. CorrDocRefID refers to the DocRefID of the original record, while a subsequent correction has been received which has a new DocRefID/CorrDocRefID)"
    validation_description: "The corrected record is no longer valid (invalidated or outdated by a previous correction message). As a consequence, no further information should have been received on this version of the record."

  - number: "60010"
    path_target: "GLOBEBody/FilingInfo/DocSpec/DocTypeIndic"
    element_name: "DocTypeIndic"
    validation_rule: "The FilingInfo cannot be deleted without deleting all related General Section, Summary, JurisdictionSection and UTPRAttribution records"
    validation_description: "To delete the FilingInfo please ensure that a deletion request has been sent for all associated General Section, Summary, JurisdictionSection and UTPRAttribution records."

  - number: "60011"
    path_target: ".//DocRefld"
    element_name: "DocRefld"
    validation_rule: "The DocRefld must be in the correct format: [CountryCode of the sending jurisdiction] [ReportingYear][UniqueID]"
    validation_description: "The structure of the DocRefld is not in the correct format."

  - number: "60012"
    path_target: "//CorrDocRefld"
    element_name: "CorrDocRefld"
    validation_rule: "When DocTypeIndic is OECD1 or OECDO, the CorrDocRefld field must be omitted."
    validation_description: "When an element has DocTypeIndic of OECD1 or OECD0, which indicates that a new lodgment or a resend is being made, the CorrDocRefld field must not be completed."

  - number: "60013"
    path_target: "GLOBEBody/GeneralSection/DocSpec/DocTypeIndic\nGLOBEBody/Summary/DocSpec/DocTypeIndic\nGLOBEBody/JurisdictionSection/DocSpec/DocTypeIndic\nGLOBEBody/UTPRAttribution/DocSpec/DocTypeIndic"
    element_name: "DocTypeIndic"
    validation_rule: "The Resend option may only be used with respect to the FilingInfo element. The value of OECDO is not an acceptable input in the DocTypeIndic for the GeneralSection, Summary, JurisdictionSection, UTPRAttribution"
    validation_description: "OECDO is only a valid input for the DocTypeIndic of the FilingInfo and should not be used for any other element."

  - number: "60014"
    path_target: "GLOBEBody/FilingInfo/DocSpec/DocRefld"
    element_name: "DocRefld"
    validation_rule: "When the DocTypeIndic is OECDO for the FilingInfo, The DocRefID must be the same as the DocReflD that was used for the latest version of the FilingInfo"
    validation_description: "An unknown or invalid DocRefID was specified for the Resend option (OECDO)."

  - number: "60015"
    path_target: ".//CorrDocRefld"
    element_name: "CorrDocRefld"
    validation_rule: "The corrected element does not specify any CorrDocRefld (OECD2/3 without CorrDocRefld data)."
    validation_description: "When DocTypeIndic is \"OECD2\" or \"OECD3\", CorrDocRefld must be provided."

  - number: "60016"
    path_target: "GloBEBody/Filinginfo/DocSpec/DocTypeIndic\nGloBEBody/GeneralSection/DocSpec/DocTypeIndic"
    validation_rule: "If the value of FilingInfo DoctypeIndic element is OECDO, if General Section is provided, the value of General Section DocTypeIndic element must not be OECD1."
    validation_description: "A new General Section can't be filed if one already exists. Please process with a correction or deletion if the General Section has to be modified."

  - number: "60017"
    path_target: "GloBEBody/Filinginfo/DocSpec/DocTypeIndic"
    validation_rule: "If the value of FilingInfo DoctypeIndic element is OECD1, the General Section must be provided."
    validation_description: "Each new GIR filing must contain a General Section."

  - number: "60018"
    path_target: ".//RecJurCode"
    element_name: "RecJurCode"
    validation_rule: "At least one Country ISO Code in RecJurCode must be the same as the ReceivingCountry."
    validation_description: "At least one Country ISO Code in RecJurCode must be the same as the ReceivingCountry."

  - number: "60019"
    path_target: ".//RecJurCode"
    element_name: "RecJurCode"
    validation_rule: "Where the Role of the Filing CE is GIR403, GIR404, GIR405, then the GIR is only a local lodgement and must not be exchanged."
    validation_description: "The RecJurCode should be (name of the local jurisdiction) as the FilingCE role provide suggests that the GIR is only a local lodgment and must not be exchanged."

  - number: "60020"
    path_target: "GLOBEBody/FilingInfo/Period/Start"
    path_reference: "GLOBEBody/FilingInfo/Period/End"
    element_name: "Start"
    validation_rule: "Period start date must not be later than the Period end date"
    validation_description: "Period start date must be earlier than or same as Period end date."

  - number: "60021"
    path_target: "GLOBEBody/FilingInfo/Period/End"
    path_reference: "MessageSpec/ReportingPeriod"
    element_name: "End"
    validation_rule: "Reporting Period End Date must not be later than the Reporting Period in the Message Header."
    validation_description: "The Reporting Period End Date must not be a date which is beyond the Reporting Period date in the MessageHeader"

  - number: "60022"
    path_target: "GLOBEBody/FilingInfo/FilingCE/TIN"
    path_reference: "GLOBEBody/FilingInfo/FilingCE/Role\nGLOBEBody/GeneralSection/CorporateStructure/UPE/ExcludedUPE/ID/TIN\nGLOBEBody/GeneralSection/CorporateStructure/UPE/OtherUPE/ID/TIN"
    element_name: "Role"
    validation_rule: "When the role is GIR401, the FilingCE TIN should match at least one of the TINs provided in the ID of the UPE element, whether it is OtherUPE or ExcludedUPE"
    validation_description: "When the UPE is lodging the GIR, then the contents of the FilingCE must match at least one of the TINs provided in the UPE element (either the OtherUPE or ExcludedUPE)"

  - number: "60023"
    path_target: "GLOBEBody/FilingInfo/FilingCE/ResCountryCode"
    path_reference: "MessageSpec/TransmittingCountry"
    element_name: "ResCountryCode"
    validation_rule: "The ResCountryCode of the FilingCE must match to the Transmitting Country"
    validation_description: "The ResCountryCode of the FilingCE must match to the Transmitting Country"

  - number: "60024"
    path_target: "GLOBEBody/Summary/JurWithTaxingRights"
    path_reference: "GLOBEBody/Summary/SafeHarbour\nGLOBEBody/Summary/ETRRange\nGLOBEBody/Summary/SBIE\nGLOBEBody/Summary/QDMTTut\nGLOBEBody/Summary/GLOBETut"
    element_name: "JurWithTaxingRights"
    validation_rule: "If the Summary contains any of the following elements: SafeHarbour, ETRRange, SBIE, QDMTTut, GLOBETut, then the JurWithTaxingRights/JurisdictionName must be provided."
    validation_description: "If the Summary contains any of the following elements: SafeHarbour, ETRRange, SBIE, QDMTTut, GLOBETut, then the JurWithTaxingRights/JurisdictionName must be provided."

  - number: "60025"
    path_target: "GLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/OverallComputation/ETRRate"
    path_reference: "GLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/OverallComputation/NetGlobelncome/Total\nGLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/OverallComputation/AdjustedCoveredTax/Total"
    element_name: "ETRRate"
    validation_rule: "The ETRRate must be equal to the integer value reported at the AdjustedCovered Tax/Total element DIVIDED by the integer reported at the NetGlobeIncome/Total element. This rule does not apply if the NetGloBEIncome in the jurisdiction is zero (or negative). If AdjustedCovered Tax/Total element is not provided, then value assumed to be 0."
    validation_description: "The ETRRate must equal AdjustedCovered Tax/Total (Divided by) NetGlobeIncome/Total"

  - number: "60026"
    path_target: "GLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/OverallComputation/TopUpTax"
    path_reference: "GLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/OverallComputation/TopUpTaxPercentage\nGLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/OverallComputation/ExcessProfits\nGLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/OverallComputation/AdditionalTopUpTax/NONArt4.1.5/AdditionalTopUpTax\nGLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/OverallComputation/AdditionalTopUpTax/Art4.1.5/AdditionalTopUpTax\nGLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/OverallComputation/QDMTT/Amount"
    element_name: "TopUp Tax"
    validation_rule: "TopUpTax must equal the following calculation: (TopUp TaxPercentage * Excess Profits) + (NONArt.4.1.5/Additional TopUpTax + Art4.1.5AdditionalTopUpTax/) - QDMTT/Amount. If any elements are not provided, these should be treated as a 0 value."
    validation_description: "Note that Additional TopUpTax is an optional field and as such, if no Additional TopUpTax element is provided, the calculation should then be read as: (TopUpTaxPercentage * Excess Profits) + 0 - QDMTT/Amount"

  - number: "60027"
    path_target: "GLOBEBody/JurisdictionSection/LowTaxJurisdiction/LTCE/IIR/ParentEntity/TopUpTax"
    path_reference: "GLOBEBody/JurisdictionSection/LowTaxJurisdiction/LTCE/IIR/ParentEntity/TopUpTaxShare\nGLOBEBody/JurisdictionSection/LowTaxJurisdiction/LTCE/IIR/ParentEntity/IIROffset"
    element_name: "TopUpTax"
    validation_rule: "The IIR/ParentEntity/TopUp Tax integer must equal the following calculation: IIR/ParentEntity/TopUpTaxShare - IIROffSet"
    validation_description: "The IIR/ParentEntity/TopUpTax integer must equal the following calculation: TopUpTaxShare - IIROffSet"

  - number: "60028"
    path_target: "GLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/CEComputation/AdjustedFANIL/Total"
    path_reference: "GLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/CEComputation/AdjustedFANIL/FANIL\nGLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/CEComputation/AdjustedFANIL/Adjustment/MainEntityPEandFTE/Additions\nGLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/CEComputation/AdjustedFANIL/Adjustment/MainEntityPEandFTE/Reductions"
    element_name: "AdjustedFANIL/Total"
    validation_rule: "The Total must equal the following calculation: AdjustedFANIL/FANIL + (sum of all MainEntityPEandFTE/Additions elements) - (sum of all MainEntityPEandFTE/Reductions elements)"
    validation_description: "The Total must equal the following calculation: FANIL/FANIL + (sum of all Main EntityPEandFTE/Additions elements) - (sum of all MainEntityPEandFTE/Reductions elements) Adjusted"

    other_record_errors:
  - number: "70001"
    path_target: "//TIN"
    element_name: "TypeOfTIN"
    validation_rule: "If TypeOfTIN is GIR3004 then TIN must contain the text 'NOTIN', flag Unknown must be TRUE and IssuedBy must not be provided"
    validation_description: "If TypeOfTIN is GIR3004 then TIN must contain the text 'NOTIN', flag Unknown must be TRUE and IssuedBy must not be provided"

  - number: "70002"
    path_target: "//TIN"
    element_name: "TypeOfTIN"
    validation_rule: "If TIN value is 'NOTIN' then TypeOfTIN must be GIR3004, flag Unknown must be TRUE and IssuedBy must not be provided."
    validation_description: "If TIN value is 'NOTIN' then TypeOfTIN must be GIR3004, flag Unknown must be TRUE and IssuedBy must not be provided."

  - number: "70003"
    path_target: "//TIN"
    element_name: "unknown"
    validation_rule: "If flag Unknown is TRUE then TIN must be NOTIN, TypeOfTIN must be GIR3004 and IssuedBy must not be provided."
    validation_description: "If flag Unknown is TRUE then TIN must be NOTIN, TypeOfTIN must be GIR3004 and IssuedBy must not be provided."

  - number: "70004"
    path_target: "//TIN"
    element_name: "issuedBy"
    validation_rule: "Where the TIN has the issuedby value of (local jurisdiction), then the TIN should be a valid TIN per the local jurisdiction"
    validation_description: "This validation is only to be applied by the jurisdiction issuing the TIN unless a TIN validation tool is available."

  - number: "70005"
    path_target: "//TIN"
    validation_rule: "Attributes issuedBy and TypeofTIN must always be present, except that issued By is not required when TypeOfTIN is GIR3003 or GIR3004."
    validation_description: "Attributes issuedBy and TypeofTIN must always be present, except that issuedBy is not required when TypeOfTIN is GIR3003 or GIR3004."

  - number: "70006"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/UPE/ExcludedUPE/ID/TIN\nGLOBEBody/GeneralSection/CorporateStructure/UPE/OtherUPE/ID/TIN\nGLOBEBody/GeneralSection/CorporateStructure/CE/ID/TIN\nGLOBEBody/GeneralSection/CorporateStructure/CE/QIIR/Exception/TIN\nGLOBEBody/JurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/CEComputation/Elections/Aggregated Reporting/TaxConsol Group TIN"
    path_reference: "GeneralSection/CorporateStructure/UPE/ExcludedUPE/ID/TIN\nGeneralSection/CorporateStructure/UPE/OtherUPE/ID/TIN\nGeneralSection/CorporateStructure/CE/ID/TIN (except when GloBEStatus contains the value of GIR316 or GIR318)\nGeneralSection/CorporateStructure/CE/QIIR/Exception/TIN\nJurisdictionSection/GLOBETax/ETR/ETRStatus/ETRComputation/CEComputation/Elections/Aggregated Reporting/TaxConsolGroup TIN"
    element_name: "Type of TIN\nTIN"
    validation_rule: "The following TIN elements must not be completed using TypeofTIN GIR3004 and must not be flagged Unknown:"
    validation_description: "The following TIN elements must not be completed using TypeofTIN GIR3004 and must not be flagged Unknown:\nGeneral Section/Corporate Structure/UPE/ExcludedUPE/ID/TIN\nGeneral Section/Corporate Structure/UPE/OtherUPE/ID/TIN\nGeneral Section/CorporateStructure/CE/ID/TIN (except when GloBEStatus contains the value of GIR316 or GIR318)\nGeneral Section/CorporateStructure/CE/QIIR/Exception/TIN\nJurisdiction Section/GLOBETax/ETR/ETRStatus/ETRComputation/CEComputation/Elections/Aggregated Reporting/TaxConsolGroup TIN"

  - number: "70007"
    path_target: "//TIN"
    element_name: "TIN"
    validation_rule: "Where the TypeofTIN entered is GIR3003 a reference must be created in the format [P2JJYYYYMMDDCCCXXX where P2 is constant, JJ is the ISO Code of the jurisdiction of location of the Constituent Entity, YYYYMMDD refers to the date of creation of the reference, CCC is a three letter reference to the company or group, and XXX is a unique number for the entity within the GIR e.g. 001, 002, 003 to differentiate between multiple entites with designated references in the same report]. This reference is superseded only in the case that a government or administration issues a tax reference or functional equivalent for the entity."
    validation_description: "Where the TypeofTIN entered is GIR3003 a reference must be created in the format [P2JJYYYYMMDDCCCXXX where P2 is constant, JJ is the ISO Code of the jurisdiction of location of the Constituent Entity, YYYYMMDD refers to the date of creation of the reference, CCC is a three letter reference to the company or group, and XXX is a unique number for the entity within the GIR e.g. 001, 002, 003 to differentiate between multiple entites with designated references in the same report]. This reference is superseded only in the case that a government or administration issues a tax reference or functional equivalent for the entity."

  - number: "70008"
    path_target: "GloBEBody/UTPRAttribution/RecJurCode"
    path_reference: "GloBEBody/JurisdictionSection/JurWithTaxingRights/JurisdictionName\nGloBEBody/GeneralSection/CorporateStructure/UPE/ID/ResCountryCode"
    element_name: "RecJurCode"
    validation_rule: "The Jurisdiction reported in the RecJurCode must be the UPE jurisdiction or one of the Jurisdictions reported in the JurisdictionName element of the repeatable JurWith TaxingRights element indicating the names of the jurisdictions that have taxing rights in respect of the jurisdiction for which the Jurisdictional Section is being prepared."
    validation_description: "The Jurisdiction reported in the RecJurCode must be the UPE jurisdiction or one of the jurisdictions reported in the JurisdictionName element of the repeatable JurWith TaxingRights element."

  - number: "70009"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/UPE/ExcludedUPE/ID/GloBEStatus\nGLOBEBody/GeneralSection/CorporateStructure/UPE/OtherUPE/ID/GloBEStatus"
    element_name: "GloBEStatus"
    validation_rule: "The UPE GloBEStatus should not accept the following values: GIR305, GIR307,GIR308, GIR309,GIR312,GIR313,GIR314, GIR315,GIR317, GIR318"
    validation_description: "An Invalid GloBE Status of the UPE was provided. Please ensure that the GloBEStatus of the UPE align with note 1.3.1.6 of the GIR."

  - number: "70010"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/UPE/OtherUPE/ID/ResCountryCode"
    element_name: "ResCountryCode"
    validation_rule: "Only one value is allowed for the ResCountryCode of the UPE/OtherUPE"
    validation_description: "The Filing Constituent Entity shall report the 2-character alphabetic country code based on the ISO 3166-1 Alpha 2 standard for the jurisdiction where the UPE/OtherUPE is located for GloBE purposes."

  - number: "70011"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/ResCountryCode"
    element_name: "ResCountryCode"
    validation_rule: "Only one value is allowed for the ResCountryCode of the CE"
    validation_description: "The Filing Constituent Entity shall report the 2-character alphabetic country code based on the ISO 3166-1 Alpha 2 standard for the jurisdiction where the CE is located for GloBE purposes."

  - number: "70012"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/UPE/ExcludedUPE/ID/Rules\nGLOBEBody/GeneralSection/CorporateStructure/UPE/OtherUPE/ID/Rules\nGLOBEBody/GeneralSection/CorporateStructure/CE/ID/Rules"
    element_name: "Rules"
    validation_rule: "All Entities (i.e. ExcludedUPE, OtherUPE or CEs) with residence in same Jurisdiction (same ResCountryCode) must have same Rules, unless the Rules element contains the Value GIR204 (QDMTT)."
    validation_description: "The 'rules' should be completed in accordance with GIR Note 1.3.2.1.3. Where the rules apply to all entities with residence in the same jurisdiction, the Rules Value should be the same. The rules value might be different where the QDMTT in that jurisdiction treats certain entities differently (e.g. where the QDMTT does not apply to investment entities, meaning that where GloBEStatus = GIR310, the rules value of GIR204 might not be an exact match."

  - number: "70013"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GloBEStatus"
    element_name: "GloBEStatus"
    validation_rule: "When the GloBEStatus contains the value of GIR313, the value of GIR314 must not also be reported for the same CE"
    validation_description: "A CE element has been completed with a GloBE Status which indicates that an entity is both a JV and a JV Subsidiary, please ensure that the GloBEStatus of the same CE does not contain GIR313 and GIR314"

  - number: "70014"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GloBEStatus"
    element_name: "GloBEStatus"
    validation_rule: "When the GloBEStatus contains the value of GIR307, the value of GIR308 must not also be reported for the same CE"
    validation_description: "A CE has been identified as having the GloBE Status of both a Minority-Owned Parent Entity and a Minority-Owned Subsidiary, please ensure that the GloBEStatus of the same CE does not contain GIR307 and GIR308"

  - number: "70015"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GloBEStatus"
    element_name: "GloBEStatus"
    validation_rule: "When the GloBEStatus contains the value of GIR308, then there must be another CE in the corporate structure which contains the value of GIR307 (i.e. when CE/ID/GloBEStatus = GIR308, must also be a separate CE element which contains CE/ID/GloBEStatus=GIR307)"
    validation_description: "A Minority-Owned Subsidiary has been identified in the Corporate Structue and there is no other CE reported in the corporate Structure which is a Minority-Owned Parent Entity."

  - number: "70016"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GloBEStatus"
    element_name: "GloBEStatus"
    validation_rule: "When the GloBEStatus contains the value of GIR307, the value of GIR309 should also be reported in the GloBEStatus"
    validation_description: "A Minority-Owned Parent Entity must also be a Minority-Owned Constituent Entity, as a result when the value of GIR307 is selected for the GloBEStatus then the value of GIR309 must also be provided."

  - number: "70017"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GloBEStatus"
    element_name: "GloBEStatus"
    validation_rule: "When the GloBEStatus contains the value of GIR308, the value of GIR309 should also be reported in the GloBEStatus"
    validation_description: "A Minority-Owned Subsidiary must also be a Minority-Owned Constituent Entity, as a result when GIR308 is selected for the GloBEStatus then the value of GIR309 must also be selected"

  - number: "70018"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GloBEStatus"
    element_name: "GloBEStatus"
    validation_rule: "When the GloBEStatus contains the value of GIR305, the value of GIR306 must not also be reported for the same CE"
    validation_description: "A CE has been identified as having the GloBE Status of both a Permanent Establishment and a Main entity, whereas the same CE cannot have the GloBE Status of PE and ME."

  - number: "70019"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GloBEStatus"
    element_name: "GloBEStatus"
    validation_rule: "When the GloBEStatus contains the value of GIR305, then there must be another CE which contains the GloBEStatus of GIR306 (i.e. when CE/ID/GloBEStatus = GIR305, there must also be a separate CE element which contains CE/ID/GloBEStatus = GIR306)"
    validation_description: "A permanent establishment has been reported in the Corporate Structure of the GIR, and no main entity has been reported."

  - number: "70020"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GloBEStatus"
    element_name: "GloBEStatus"
    validation_rule: "If the GloBEStatus contains the value of GIR316 or GIR318, then there should be no other value in the GloBEStatus (if GloBEStatus = GIR316 - GloBEStatus can only contain the value of GIR316 and if GloBEStatus = GIR318 - GloBEStatus can only contain the value of GIR318)"
    validation_description: "A NonGroup -member or excluded entity was reported in the GloBEStatus and at least one additional GloBEStatus was reported. When the CE element has the GloBEStatus of GIR316 or GIR318, it can only contain the single value in the GloBEStatus (i.e. only GIR316 or only GIR318)"

    other_record_errors:
  - number: "70021"
    path_target: "GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GloBEStatus"
    path_reference: "GLOBEBody/GeneralSection/CorporateStructure/CE/OwnershipChange\nGLOBEBody/GeneralSection/CorporateStructure/CE/OwnershipChange/PreGlobeStatus"
    element_name: "GloBEStatus"
    validation_rule: "The GloBEStatus element cannot contain the value of GIR316 or GIR318, unless there is a completed OwnershipChange for the CE element (i.e., when Corporate Structure/CE/ID/TIN matches to Corporate Structure/CE/OwnershipChange/PreOwnership/TIN)."
