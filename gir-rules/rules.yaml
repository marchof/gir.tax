      Each code for this AdjustmentItem element cannot be used more than once per ETR
      element in the Jurisdiction Section.
    description: >-
      Each code for this AdjustmentItem element cannot be used more than once per ETR
      element in the Jurisdiction Section.

  - number: 70081
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:AdjustedCoveredTax/globe:DeferTaxAdjustAmt/globe:Transition/globe:DeferredTaxAssets/globe:Total
    test: >-
      number(.) =
      number(../globe:DeferredTaxAssetStart) - number(../globe:DeferredTaxAssetExcluded) or
      number(.) =
      number(../globe:DeferredTaxAssetRecast) - number(../globe:DeferredTaxAssetExcluded)
    rule: >-
      The total element should be equal to the following calculation:
      DeferredTaxAssetStart - DeferredTaxAssetExcluded OR
      DeferredTaxAssetRecast - DeferredTaxAssetExcluded
    description: >-
      The total element should be equal to the following calculation:
      DeferredTaxAssetStart - DeferredTaxAssetExcluded OR
      DeferredTaxAssetRecast - DeferredTaxAssetExcluded

  - number: 70082
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:AdjustedCoveredTax/globe:DeferTaxAdjustAmt/globe:Transition/globe:DeferredTaxAssets/globe:DeferredTaxAssetStart
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:AdjustedCoveredTax/globe:DeferTaxAdjustAmt/globe:Transition/globe:DeferredTaxAssets/globe:DeferredTaxAssetRecast
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/AdjustedCoveredTax/DeferTaxAdjustAmt/Transition/DeferredTaxAssets
    element: DeferredTaxAsset
    rule: >-
      When the DeferredTaxAssets element is provided, then one of
      DeferredTaxAssetStart or DeferredTaxAssetRecast must contain the value of '0'
    description: >-
      To calculate the Deferred tax assets taken into account for GloBE purposes,
      ensure that either the DeferredTaxAsset at the start of the year or the
      DeferredTaxAsset recast at the minimum rate is used, both values cannot be
      used. Therefore, ensure that when calculating the DeferredTaxAsset/total
      element, that one of DeferredTaxAssetStart or DeferredTaxAssetRecast contains
      the value of 0

  - number: 70083
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:ExcessNegTaxExpense/globe:Remaining
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/ExcessNegTaxExpense/PriorYearBalance
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/ExcessNegTaxExpense/GeneratedInRFY
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/ExcessNegTaxExpense/UtilizedInRFY
    element: Remaining
    rule: >-
      The Remaining value should equal the following calculation: Prior YearBalance +
      GeneratedInRFY - UtilizedInRFY
    description: >-
      The Remaining value should equal the following calculation: Prior YearBalance +
      GeneratedInRFY - UtilizedInRFY

  - number: 70084
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:AdjustedCoveredTax/globe:Adjustments/globe:Amount
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/ExcessNegTaxExpense/GeneratedInRFY
    element: GeneratedInRFY
    rule: >-
      If the Adjustmentitem element has the value of GIR2719, then the value reported
      in the 'amount' element should be the same as the integer reported in the
      GeneratedInRFY element
    description: >-
      In the 'Adjusted Covered Tax' element, a lodger can select from a list of
      possible adjustments, and must report the following 'Name of adjustment
      (enumeration) and the amount of said adjustment. If the selected 'adjustment'
      has the 'AdjustmentItem' value of 'GIR2719', then the value which is entered
      into the 'amount' element should be an exact match to the integer reported in
      the GeneratedInRFY element.

  - number: 70085
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:AdjustedCoveredTax/globe:Adjustments/globe:AdjustmentItem
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/ExcessNegTaxExpense/UtilizedInRFY
    element: UtilizedInRFY
    rule: >-
      If the Adjustmentitem element has the value of GIR2720, then the value reported
      in the 'amount' element should be the same as the integer reported in the
      UtilizedInRFY element
    description: >-
      If the AdjustedItem element has the value of GIR2720, then the value reported in
      the 'amount' element should be the same as the integer reported in the
      UtilizedInRFY element

  - number: 70086
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:ExcessProfits
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/NetGlobeIncome/Total
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/SubstanceExclusion/Total
    element: ExcessProfits
    rule: >-
      The ExcessProfits integer is equal to the following calculation:
      NetGlobeIncome/Total - SubstanceExclusion/Total. If SubstanceExclusion/Total
      is not provided, then should be treated as a 0 value. If the
      NetGlobeIncome/Total - SubstanceExclusion/Total results in a number less than
      0, then ExcessProfits must equal to 0.
    description: >-
      The ExcessProfits integer is equal to the following calculation:
      NetGlobeIncome/Total - SubstanceExclusion/Total. If SubstanceExclusion/Total
      is not provided, then should be treated as a 0 value. If the
      NetGlobeIncome/Total - SubstanceExclusion/Total results in a number less than
      0, then ExcessProfits must equal to 0.

  - number: 70087
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:SubstanceExclusion/globe:Total
    test: >-
      number(.) =
      number(../globe:PayrollCost) * number(../globe:PayrollMarkUp) +
      number(../globe:TangibleAssetValue) * number(../globe:TangibleAssetMarkup)
    rule: >-
      The Total integer for the SubstanceExclusion is equal to the following
      calculation: PayrollCost * PayrollMarkUp + TangibleAssetValue * TangibleAssetMarkup
    description: >-
      The Total integer for the SubstanceExclusion is equal to the following
      calculation: PayrollCost * PayrollMarkUp + TangibleAssetValue *
      TangibleAssetMarkup

  - number: 70088
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:AdditionalTopUpTax/globe:Art4.1.5
    references:
