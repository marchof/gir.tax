    description: >-
      The ExpectedAdjustedCoveredTax must be equal to the following calculation:
      GlobeLoss * 15%

  - number: 70092
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:AdditionalTopUpTax/globe:Art4.1.5/globe:AdditionalTopUpTax
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/AdditionalTopUpTax/Art4.1.5/ExpectedAdjustedCoveredTax
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/AdditionalTopUpTax/Art4.1.5/AdjustedCoveredTax
    element: AdditionalTopUpTax
    rule: >-
      The AdditionalTopUpTax integer is equal to the following calculation:
      ExpectedAdjustedCoveredTax - AdjustedCoveredTax. If the
      ExpectedAdjustedCoveredTax - AdjustedCoveredTax results in a number less than
      0, then AdditionalTopUpTax must equal to 0.
    description: >-
      The AdditionalTopUpTax integer is equal to the following calculation:
      ExpectedAdjustedCoveredTax - AdjustedCoveredTax. If the
      ExpectedAdjustedCoveredTax - AdjustedCoveredTax results in a number less than
      0, then AdditionalTopUpTax must equal to 0.

  - number: 70093
