      Year.
    description: >-
      The UTPRPercentage must be 0% when the UTPRTopUpTaxCarryForward is greater than
      0. If the UTPRTopUpTaxCarryForward is 0, then the UTPRPercentage can only be 0%
      when all UTPR jurisdictions have a UTPR Percentage of 0 in the Reporting Fiscal
      Year.

  - number: 70104
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:UTPRAttribution/globe:Attribution/globe:UTPRTopUpTaxCarriedForward
    element: UTPRTopUpTaxCarriedForward
    rule: >-
      The UTPRTopUpTaxCarriedForward cannot be a negative value.
    description: >-
      The UTPRTopUpTaxCarriedForward must be a positive value

  - number: 70105
