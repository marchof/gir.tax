xmlnamespaces:
  globe: "urn:oecd:ties:globe:v2"
  iso: "urn:oecd:ties:isoglobetypes:v1"
  stf: "urn:oecd:ties:globestf:v5"

rules:

  - number: 60001
    targets:
      - /globe:GLOBE_OECD/globe:MessageSpec/globe:MessageRefId
    element: MessageRefld
    rule: >-
      The MessageRefld must be in the correct format: [CountryCode of the sending
      jurisdiction] [Reporting Period] [CountryCode of the receiving jurisdiction]
      [UniqueID]
    description: >-
      The structure of the MessageRefld is not in the correct format. Please ensure
      the MessageRefld follows structure defined in the GIR User Guide, and resubmit
      the file.

  - number: 60002
    targets:
      - /globe:GLOBE_OECD/globe:MessageSpec/globe:MessageRefId
    element: MessageRefld
    rule: >-
      The GIR Message Header has a duplicate MessageRefld value that was received on
      a previous file.
    description: >-
      Please replace the MessageRefld field value with a new unique value (not
      containing all blanks), and resubmit the file.

  - number: 60003
    targets:
      - /globe:GLOBE_OECD/globe:MessageSpec/globe:ReportingPeriod
    element: ReportingPeriod
    rule: >-
      The ReportingPeriod YYYY value must be less than or equal to current year
    description: >-
      ReportingPeriod year must be less than or equal to current year.

  - number: 60004
    targets:
      - //stf:DocTypeIndic
    rule: >-
      A message can contain either new records (OECD1) or corrections (OECD2 or
      OECD3), but should not contain a mixture of both.
    description: >-
      This message contains a mix of new records (OECD1) and corrections
      (OECD2/OECD3). Please ensure the DocTypeIndic elements contain either new
      records (OECD1) or corrections (OECD2 or OECD3), but not a mixture of both.

  - number: 60005
    targets:
      - //stf:DocTypeIndic
    element: DocTypeIndic
    rule: >-
      When DocTypeIndic is OECD2 or OECD3, the record must concern the same sub
      section (FilingInfo, General section, Summary, JuridictionSection or
      UTPRAttribution) as the CorrDocRefld.
    description: >-
      The correction or deletion refers to a record of an other sub section.

  - number: 60006
    targets:
      - //stf:CorrDocRefId
    element: CorrDocRefld
    rule: >-
      The same DocReflD cannot be corrected or deleted twice in the same message.
    description: >-
      The same DocRefID cannot be corrected or deleted twice in the same message,
      therefore each CorrDocRefID must be unique within the same message.

  - number: 60007
    targets:
      - //stf:DocRefId
    element: DocRefId
    rule: >-
      The DocRefID is already used for another record.
    description: >-
      The provided DocRefID has already been used for a pre-existing record, please
      relodge and ensure that the provided DocRefID is in accordance with the OECD GIR
      XML Schema User Guide and is 'unique in time and space'.

  - number: 60008
    targets:
      - //stf:CorrDocRefId
    element: CorrDocRefld
    rule: >-
      The CorrDocRefid refers to an unknown record.
    description: >-
      The CorrDocRefld provided does not match to an existing record of a DocRefld,
      please relodge the file and ensure that the CorrDocRefld is an exact match to
      the DocRefld of the element which is subject to a correction

  - number: 60009
    targets:
      - //stf:CorrDocRefId
    element: CorrDocRefld
    rule: >-
      The CorrDocRefID must relate to the latest instance of the DocRefID. The
      CorrDocRefID cannot reference an invalidated or outdated version of the DocRefID
      (i.e. CorrDocRefID refers to the DocRefID of the original record, while a
      subsequent correction has been received which has a new DocRefID/CorrDocRefID)
    description: >-
      The corrected record is no longer valid (invalidated or outdated by a previous
      correction message). As a consequence, no further information should have been
      received on this version of the record.

  - number: 60010
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:FilingInfo/globe:DocSpec/stf:DocTypeIndic
    element: DocTypeIndic
    rule: >-
      The FilingInfo cannot be deleted without deleting all related General Section,
      Summary, JurisdictionSection and UTPRAttribution records
    description: >-
      To delete the FilingInfo please ensure that a deletion request has been sent for
      all associated General Section, Summary, JurisdictionSection and UTPRAttribution
      records.

  - number: 60011
    targets:
      - //stf:DocRefId
    element: DocRefld
    rule: >-
      The DocRefld must be in the correct format: [CountryCode of the sending
      jurisdiction] [ReportingYear][UniqueID]
    description: >-
      The structure of the DocRefld is not in the correct format.

  - number: 60012
    targets:
      - //stf:CorrDocRefId
    element: CorrDocRefld
    rule: >-
      When DocTypeIndic is OECD1 or OECDO, the CorrDocRefld field must be omitted.
    description: >-
      When an element has DocTypeIndic of OECD1 or OECD0, which indicates that a new
      lodgment or a resend is being made, the CorrDocRefld field must not be
      completed.

  - number: 60013
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:DocSpec/stf:DocTypeIndic
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:DocSpec/stf:DocTypeIndic
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:DocSpec/stf:DocTypeIndic
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:UTPRAttribution/globe:DocSpec/stf:DocTypeIndic
    element: DocTypeIndic
    rule: >-
      The Resend option may only be used with respect to the FilingInfo element. The
      value of OECDO is not an acceptable input in the DocTypeIndic for the
      GeneralSection, Summary, JurisdictionSection, UTPRAttribution
    description: >-
      OECDO is only a valid input for the DocTypeIndic of the FilingInfo and should
      not be used for any other element.

  - number: 60014
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:FilingInfo/globe:DocSpec/stf:DocRefId
    element: DocRefld
    rule: >-
      When the DocTypeIndic is OECDO for the FilingInfo, The DocRefID must be the same
      as the DocReflD that was used for the latest version of the FilingInfo
    description: >-
      An unknown or invalid DocRefID was specified for the Resend option (OECDO).

  - number: 60015
    targets:
      - .//stf:CorrDocRefId
    element: CorrDocRefld
    rule: >-
      The corrected element does not specify any CorrDocRefld (OECD2/3 without
      CorrDocRefld data).
    description: >-
      When DocTypeIndic is "OECD2" or "OECD3", CorrDocRefld must be provided.

  - number: 60016
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:FilingInfo/globe:DocSpec/stf:DocTypeIndic
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:DocSpec/stf:DocTypeIndic
    rule: >-
      If the value of FilingInfo DoctypeIndic element is OECDO, if General Section is
      provided, the value of General Section DocTypeIndic element must not be OECD1.
    description: >-
      A new General Section can't be filed if one already exists. Please process with
      a correction or deletion if the General Section has to be modified.

  - number: 60017
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:FilingInfo/globe:DocSpec/stf:DocTypeIndic
    rule: >-
      If the value of FilingInfo DoctypeIndic element is OECD1, the General Section
      must be provided.
    description: >-
      Each new GIR filing must contain a General Section.

  - number: 60018
    targets:
      - //globe:RecJurCode
    element: RecJurCode
    rule: >-
      At least one Country ISO Code in RecJurCode must be the same as the
      ReceivingCountry.
    description: >-
      At least one Country ISO Code in RecJurCode must be the same as the
      ReceivingCountry.

  - number: 60019
    targets:
      - //globe:RecJurCode
    element: RecJurCode
    rule: >-
      Where the Role of the Filing CE is GIR403, GIR404, GIR405, then the GIR is only
      a local lodgement and must not be exchanged.
    description: >-
      The RecJurCode should be (name of the local jurisdiction) as the FilingCE role
      provide suggests that the GIR is only a local lodgment and must not be
      exchanged.

  - number: 60020
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:FilingInfo/globe:Period/globe:Start
    references:
      - GLOBEBody/FilingInfo/Period/End
    element: Start
    rule: >-
      Period start date must not be later than the Period end date
    description: >-
      Period start date must be earlier than or same as Period end date.

  - number: 60021
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:FilingInfo/globe:Period/globe:End
    references:
      - MessageSpec/ReportingPeriod
    element: End
    rule: >-
      Reporting Period End Date must not be later than the Reporting Period in the
      Message Header.
    description: >-
      The Reporting Period End Date must not be a date which is beyond the Reporting
      Period date in the MessageHeader

  - number: 60022
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:FilingInfo/globe:FilingCE/globe:TIN
    references:
      - GLOBEBody/FilingInfo/FilingCE/Role
      - GLOBEBody/GeneralSection/CorporateStructure/UPE/ExcludedUPE/ID/TIN
      - GLOBEBody/GeneralSection/CorporateStructure/UPE/OtherUPE/ID/TIN
    element: Role
    rule: >-
      When the role is GIR401, the FilingCE TIN should match at least one of the TINs
      provided in the ID of the UPE element, whether it is OtherUPE or ExcludedUPE
    description: >-
      When the UPE is lodging the GIR, then the contents of the FilingCE must match at
      least one of the TINs provided in the UPE element (either the OtherUPE or
      ExcludedUPE)

  - number: 60023
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:FilingInfo/globe:FilingCE/globe:ResCountryCode
    references:
      - MessageSpec/TransmittingCountry
    element: ResCountryCode
    rule: >-
      The ResCountryCode of the FilingCE must match to the Transmitting Country
    description: >-
      The ResCountryCode of the FilingCE must match to the Transmitting Country

  - number: 60024
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:JurWithTaxingRights
    references:
      - GLOBEBody/Summary/SafeHarbour
      - GLOBEBody/Summary/ETRRange
      - GLOBEBody/Summary/SBIE
      - GLOBEBody/Summary/QDMTTut
      - GLOBEBody/Summary/GLoBETut
    element: JurWithTaxingRights
    rule: >-
      If the Summary contains any of the following elements: SafeHarbour, ETRRange,
      SBIE, QDMTTut, GLoBETut, then the JurWithTaxingRights/JurisdictionName must be
      provided.
    description: >-
      If the Summary contains any of the following elements: SafeHarbour, ETRRange,
      SBIE, QDMTTut, GLoBETut, then the JurWithTaxingRights/JurisdictionName must be
      provided.

  - number: 60025
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:ETRRate
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/NetGlobeIncome/Total
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/AdjustedCoveredTax/Total
    element: ETRRate
    rule: >-
      The ETRRate must be equal to the integer value reported at the AdjustedCovered
      Tax/Total element DIVIDED by the integer reported at the NetGlobeIncome/Total
      element. This rule does not apply if the NetGlobeIncome in the jurisdiction is
      zero (or negative). If AdjustedCovered Tax/Total element is not provided, then
      value assumed to be 0.
    description: >-
      The ETRRate must equal AdjustedCovered Tax/Total (Divided by)
      NetGlobeIncome/Total

  - number: 60026
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:OverallComputation/globe:TopUpTax
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/TopUpTaxPercentage
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/ExcessProfits
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/AdditionalTopUpTax/NONArt4.1.5/AdditionalTopUpTax
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/AdditionalTopUpTax/Art4.1.5/AdditionalTopUpTax
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/OverallComputation/QDMTT/Amount
    element: TopUpTax
    rule: >-
      TopUpTax must equal the following calculation: (TopUp TaxPercentage * Excess
      Profits) + (NONArt.4.1.5/Additional TopUpTax + Art4.1.5AdditionalTopUpTax/) -
      QDMTT/Amount. If any elements are not provided, these should be treated as a 0
      value.
    description: >-
      Note that Additional TopUpTax is an optional field and as such, if no Additional
      TopUpTax element is provided, the calculation should then be read as:
      (TopUpTaxPercentage * Excess Profits) + 0 - QDMTT/Amount

  - number: 60027
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:LowTaxJurisdiction/globe:LTCE/globe:IIR/globe:ParentEntity/globe:TopUpTax
    references:
      - GLOBEBody/JurisdictionSection/LowTaxJurisdiction/LTCE/IIR/ParentEntity/TopUpTaxShare
      - GLOBEBody/JurisdictionSection/LowTaxJurisdiction/LTCE/IIR/ParentEntity/IIROffSet
    element: TopUpTax
    rule: >-
      The IIR/ParentEntity/TopUp Tax integer must equal the following calculation:
      IIR/ParentEntity/TopUpTaxShare - IIROffSet
    description: >-
      The IIR/ParentEntity/TopUpTax integer must equal the following calculation:
      TopUpTaxShare - IIROffSet

  - number: 60028
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:CEComputation/globe:AdjustedFANIL/globe:Total
    test: >-
      number(.) =
      sum(../globe:FANIL) +
      sum(../globe:Adjustment/globe:MainEntityPEandFTE/globe:Additions) -
      sum(../globe:Adjustment/globe:MainEntityPEandFTE/globe:Reductions)
    rule: >-
      The Total must equal the following calculation: AdjustedFANIL/FANIL + (sum of
      all MainEntityPEandFTE/Additions elements) - (sum of all
      MainEntityPEandFTE/Reductions elements)
    description: >-
      The Total must equal the following calculation: FANIL/FANIL + (sum of all Main
      EntityPEandFTE/Additions elements) - (sum of all MainEntityPEandFTE/Reductions
      elements) Adjusted

  - number: 70001
    targets:
      - //globe:TIN
    test: >-
      not(@TypeOfTIN='GIR3004') or
      (.='NOTIN' and (@unknown='true' or @unknown='1') and not(@issuedBy))
    rule: >-
      If TypeOfTIN is GIR3004 then TIN must contain the text 'NOTIN', flag Unknown
      must be TRUE and IssuedBy must not be provided
    description: >-
      If TypeOfTIN is GIR3004 then TIN must contain the text 'NOTIN', flag Unknown
      must be TRUE and IssuedBy must not be provided

  - number: 70002
    targets:
      - //globe:TIN
    test: >-
      not(.='NOTIN') or
      (@TypeOfTIN='GIR3004' and (@unknown='true' or @unknown='1') and not(@issuedBy))
    rule: >-
      If TIN value is 'NOTIN' then TypeOfTIN must be GIR3004, flag Unknown must be
      TRUE and IssuedBy must not be provided.
    description: >-
      If TIN value is 'NOTIN' then TypeOfTIN must be GIR3004, flag Unknown must be
      TRUE and IssuedBy must not be provided.

  - number: 70003
    targets:
      - //globe:TIN
    test: >-
      not(@unknown='true' or @unknown='1') or
      (.='NOTIN' and @TypeOfTIN='GIR3004' and not(@issuedBy))
    rule: >-
      If flag Unknown is TRUE then TIN must be NOTIN, TypeOfTIN must be GIR3004 and
      IssuedBy must not be provided.
    description: >-
      If flag Unknown is TRUE then TIN must be NOTIN, TypeOfTIN must be GIR3004 and
      IssuedBy must not be provided.

  - number: 70004
    targets:
      - //globe:TIN
    element: issuedBy
    rule: >-
      Where the TIN has the issuedby value of (local jurisdiction), then the TIN
      should be a valid TIN per the local jurisdiction
    description: >-
      This validation is only to be applied by the jurisdiction issuing the TIN unless
      a TIN validation tool is available.

  - number: 70005
    targets:
      - //globe:TIN
    rule: >-
      Attributes issuedBy and TypeofTIN must always be present, except that issued By
      is not required when TypeOfTIN is GIR3003 or GIR3004.
    description: >-
      Attributes issuedBy and TypeofTIN must always be present, except that issuedBy
      is not required when TypeOfTIN is GIR3003 or GIR3004.

  - number: 70006
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:UPE/globe:ExcludedUPE/globe:ID/globe:TIN
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:UPE/globe:OtherUPE/globe:ID/globe:TIN
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:TIN
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:QIIR/globe:Exception/globe:TIN
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRComputation/globe:CEComputation/globe:Elections/globe:AggregatedReporting/globe:TaxConsolGroupTIN
    references:
      - GeneralSection/CorporateStructure/UPE/ExcludedUPE/ID/TIN
      - GeneralSection/CorporateStructure/UPE/OtherUPE/ID/TIN
      - GeneralSection/CorporateStructure/CE/ID/TIN (except when GloBEStatus contains the value of GIR316 or GIR318)
      - GeneralSection/CorporateStructure/CE/QIIR/Exception/TIN
      - JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRComputation/CEComputation/Elections/AggregatedReporting/TaxConsolGroupTIN
    element: TypeofTIN
    rule: >-
      The following TIN elements must not be completed using TypeofTIN GIR3004 and
      must not be flagged Unknown:
    description: >-
      The following TIN elements must not be completed using TypeofTIN GIR3004 and
      must not be flagged Unknown:
      General Section/Corporate Structure/UPE/ExcludedUPE/ID/TIN
      General Section/Corporate Structure/UPE/OtherUPE/ID/TIN
      General Section/CorporateStructure/CE/ID/TIN (except when GloBEStatus contains
      the value of GIR316 or GIR318)
      General Section/CorporateStructure/CE/QIIR/Exception/TIN
      Jurisdiction
      Section/GLOBETax/ETR/ETRStatus/ETRComputation/CEComputation/Elections/Aggregated
      Reporting/TaxConsolGroup TIN

  - number: 70007
    targets:
      - //globe:TIN
    element: TIN
    rule: >-
      Where the TypeofTIN entered is GIR3003 a reference must be created in the format
      [P2JJYYYYMMDDCCCXXX where P2 is constant, JJ is the ISO Code of the jurisdiction
      of location of the Constituent Entity, YYYYMMDD refers to the date of creation
      of the reference, CCC is a three letter reference to the company or group, and
      XXX is a unique number for the entity within the GIR e.g. 001, 002, 003 to
      differentiate between multiple entites with designated references in the same
      report]. This reference is superseded only in the case that a government or
      administration issues a tax reference or functional equivalent for the entity.
    description: >-
      Where the TypeofTIN entered is GIR3003 a reference must be created in the format
      [P2JJYYYYMMDDCCCXXX where P2 is constant, JJ is the ISO Code of the jurisdiction
      of location of the Constituent Entity, YYYYMMDD refers to the date of creation
      of the reference, CCC is a three letter reference to the company or group, and
      XXX is a unique number for the entity within the GIR e.g. 001, 002, 003 to
      differentiate between multiple entites with designated references in the same
      report]. This reference is superseded only in the case that a government or
      administration issues a tax reference or functional equivalent for the entity.

  - number: 70008
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:UTPRAttribution/globe:RecJurCode
    references:
      - GLOBEBody/JurisdictionSection/JurWithTaxingRights/JurisdictionName
      - GLOBEBody/GeneralSection/CorporateStructure/UPE/ID/ResCountryCode
    element: RecJurCode
    rule: >-
      The Jurisdiction reported in the RecJurCode must be the UPE jurisdiction or one
      of the Jurisdictions reported in the JurisdictionName element of the repeatable
      JurWith TaxingRights element indicating the names of the jurisdictions that have
      taxing rights in respect of the jurisdiction for which the Jurisdictional
      Section is being prepared.
    description: >-
      The Jurisdiction reported in the RecJurCode must be the UPE jurisdiction or one
      of the jurisdictions reported in the JurisdictionName element of the repeatable
      JurWith TaxingRights element.

  - number: 70009
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:UPE/globe:ExcludedUPE/globe:ID/globe:GlobeStatus
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:UPE/globe:OtherUPE/globe:ID/globe:GlobeStatus
    element: GlobeStatus
    rule: >-
      The UPE GlobeStatus should not accept the following values: GIR305,
      GIR307,GIR308, GIR309,GIR312,GIR313,GIR314, GIR315,GIR317, GIR318
    description: >-
      An Invalid Globe Status of the UPE was provided. Please ensure that the
      GlobeStatus of the UPE align with note 1.3.1.6 of the GIR.

  - number: 70010
    targets: 
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:UPE/globe:OtherUPE/globe:ID/globe:ResCountryCode
    element: ResCountryCode
    rule: >-
      Only one value is allowed for the ResCountryCode of the UPE/OtherUPE
    description: >-
      The Filing Constituent Entity shall report the 2-character alphabetic country
      code based on the ISO 3166-1 Alpha 2 standard for the jurisdiction where the
      UPE/OtherUPE is located for GloBE purposes.

  - number: 70011
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:ResCountryCode
    element: ResCountryCode
    rule: >-
      Only one value is allowed for the ResCountryCode of the CE
    description: >-
      The Filing Constituent Entity shall report the 2-character alphabetic country
      code based on the ISO 3166-1 Alpha 2 standard for the jurisdiction where the CE
      is located for GloBE purposes.

  - number: 70012
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:UPE/globe:ExcludedUPE/globe:ID/globe:Rules
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:UPE/globe:OtherUPE/globe:ID/globe:Rules
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:Rules
    element: Rules
    rule: >-
      All Entities (i.e. ExcludedUPE, OtherUPE or CEs) with residence in same
      Jurisdiction (same ResCountryCode) must have same Rules, unless the Rules
      element contains the Value GIR204 (QDMTT).
    description: >-
      The 'rules' should be completed in accordance with GIR Note 1.3.2.1.3. Where the
      rules apply to all entities with residence in the same jurisdiction, the Rules
      Value should be the same. The rules value might be different where the QDMTT in
      that jurisdiction treats certain entities differently (e.g. where the QDMTT does
      not apply to investment entities, meaning that where GloBEStatus = GIR310, the
      rules value of GIR204 might not be an exact match.

  - number: 70013
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:GlobeStatus
    element: GlobeStatus
    rule: >-
      When the GlobeStatus contains the value of GIR313, the value of GIR314 must not
      also be reported for the same CE
    description: >-
      A CE element has been completed with a GloBE Status which indicates that an
      entity is both a JV and a JV Subsidiary, please ensure that the GloBEStatus of
      the same CE does not contain GIR313 and GIR314

  - number: 70014
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:GlobeStatus
    element: GlobeStatus
    rule: >-
      When the GlobeStatus contains the value of GIR307, the value of GIR308 must not
      also be reported for the same CE
    description: >-
      A CE has been identified as having the Globe Status of both a Minority-Owned
      Parent Entity and a Minority-Owned Subsidiary, please ensure that the
      GlobeStatus of the same CE does not contain GIR307 and GIR308

  - number: 70015
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:GlobeStatus
    element: GlobeStatus
    rule: >-
      When the GlobeStatus contains the value of GIR308, then there must be another CE
      in the corporate structure which contains the value of GIR307 (i.e. when
      CE/ID/GlobeStatus = GIR308, must also be a separate CE element which contains
      CE/ID/GlobeStatus=GIR307)
    description: >-
      A Minority-Owned Subsidiary has been identified in the Corporate Structue and
      there is no other CE reported in the corporate Structure which is a
      Minority-Owned Parent Entity.

  - number: 70016
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:GlobeStatus
    rule: >-
      When the GlobeStatus contains the value of GIR307, the value of GIR309 should
      also be reported in the GlobeStatus
    description: >-
      A Minority-Owned Parent Entity must also be a Minority-Owned Constituent Entity,
      as a result when the value of GIR307 is selected for the GlobeStatus then the
      value of GIR309 must also be provided.

  - number: 70017
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:GlobeStatus
    element: GlobeStatus
    rule: >-
      When the GlobeStatus contains the value of GIR308, the value of GIR309 should
      also be reported in the GlobeStatus
    description: >-
      A Minority-Owned Subsidiary must also be a Minority-Owned Constituent Entity, as
      a result when GIR308 is selected for the GlobeStatus then the value of GIR309
      must also be selected

  - number: 70018
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:GlobeStatus
    element: GlobeStatus
    rule: >-
      When the GlobeStatus contains the value of GIR305, the value of GIR306 must not
      also be reported for the same CE
    description: >-
      A CE has been identified as having the GlobeStatus of both a Permanent
      Establishment and a Main entity, whereas the same CE cannot have the Globe
      Status of PE and ME.

  - number: 70019
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:GlobeStatus
    element: GlobeStatus
    rule: >-
      When the GlobeStatus contains the value of GIR305, then there must be another CE
      which contains the GlobeStatus of GIR306 (i.e. when CE/ID/GlobeStatus = GIR305,
      there must also be a separate CE element which contains CE/ID/GlobeStatus =
      GIR306)
    description: >-
      A permanent establishment has been reported in the Corporate Structure of the
      GIR, and no main entity has been reported.

  - number: 70020
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:GlobeStatus
    element: GlobeStatus
    rule: >-
      If the GlobeStatus contains the value of GIR316 or GIR318, then there should be
      no other value in the GlobeStatus (if GlobeStatus = GIR316 - GlobeStatus can
      only contain the value of GIR316 and if GlobeStatus = GIR318 - GlobeStatus can
      only contain the value of GIR318)
    description: >-
      A NonGroup -member or excluded entity was reported in the GlobeStatus and at
      least one additional GlobeStatus was reported. When the CE element has the
      GlobeStatus of GIR316 or GIR318, it can only contain the single value in the
      GlobeStatus (i.e. only GIR316 or only GIR318)

    other_record_errors:
  - number: 70021
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:ID/globe:GlobeStatus
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/OwnershipChange
      - GLOBEBody/GeneralSection/CorporateStructure/CE/OwnershipChange/PreGlobeStatus
    element: GlobeStatus
    rule: >-
      The GlobeStatus element cannot contain the value of GIR316 or GIR318, unless
      there is a completed OwnershipChange for the CE element (i.e., when Corporate
      Structure/CE/ID/TIN matches to Corporate
      Structure/CE/OwnershipChange/PreOwnership/TIN).
    description: >-
      The GlobeStatus of a CE can only contain the value of 'Excluded Entity' or
      'NonGroup-Member' when there has been a change in the GlobeStatus of the
      reported CE. Therefore, there must be a completed OwnershipChange element which
      indicates the GlobeStatus before the entity became an Excluded Entity or a
      'Non-Group Member'

  - number: 70022
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:OwnershipChange/globe:ChangeDate
    references:
      - GLOBEBody/FilingInfo/Period/Start
    element: ChangeDate
    rule: >-
      The ChangeDate must not be a date which takes place before the Period Start date
      as reported in the Filing Info
    description: >-
      An ownership change has a change date which takes place before the reporting
      fiscal year

  - number: 70023
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:OwnershipChange/globe:ChangeDate
    references:
      - GLOBEBody/FilingInfo/Period/End
    element: ChangeDate
    rule: >-
      The ChangeDate must not be a date which takes place after the Period End date as
      reported in the Filing Info
    description: >-
      An ownership change has a change date which takes place after the reporting
      fiscal year

  - number: 70024
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:OwnershipChange/globe:PreOwnership
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/OwnershipChange/PreGlobeStatus
    element: PreOwnership
    rule: >-
      The PreOwnership must not be completed when the PreGlobeStatus has the value of
      GIR719
    description: >-
      Where an entity was an excluded entity before the change, then the PreOwnership
      element should not be completed.

  - number: 70025
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:OwnershipChange/globe:PreOwnership/globe:TIN
    test: >-
      not(../globe:OwnershipType='GIR805' or ../globe:OwnershipType='GIR806') or
      (.='NOTIN' and @TypeOfTIN='GIR3004')
    rule: >-
      When the Ownership Type contains the value of GIR805 or GIR806, then the
      TypeOfTIN must contain the value GIR3004 and the TIN must contain the text,
      'NOTIN'
    description: >-
      When the Ownership Type indicates that the ownership interests are held in the
      aggregate by Non-Group Members or Excluded Entities, the TIN should not reported
      and as such the TypeOfTIN must be GIR3004.

  - number: 70026
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:Ownership/globe:OwnershipPercentage
    test: >-
      not(ancestor::globe:CE[1]/globe:ID/globe:GlobeStatus='GIR305') or
      number(.)=1.000
    rule: >-
      When the GloBEStatus contains the value of GIR305, then the Ownership Percentage
      must equal 100%
    description: >-
      The ownership percentage of a PE must equal 100%

  - number: 70027
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:Ownership
    test: >-
      not(parent::globe:CE/globe:ID/globe:GlobeStatus='GIR318') or (
        number(./globe:OwnershipPercentage) = 0.000 and
        ./globe:TIN = 'NOTIN' and
        ./globe:OwnershipType = 'GIR806'
      )
    rule: >-
      When the GloBEStatus contains the value of GIR318, then the OwnershipPercentage
      should have the value of 0%, the TIN value should be NOTIN and OwnershipType
      should be GIR806.
    description: >-
      When the GloBEStatus is a 'NonGroup-Member' as a result of completion of the
      OwnershipChange element, then Ownershipercentage as reported in the
      OwnershipElement should be 0%
    implementation_notes: >-
      This specification defines 3 conditions on three different elements which does not quite fit
      in the standard format of the validation rules. Therefore we combined the 3 target path
      into a single one which selects the common parent element.
      
  - number: 70028
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:Ownership/globe:OwnershipPercentage
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GlobeStatus
    element: OwnershipPercentage
    rule: >-
      Unless the GloBEStatus contains the value of GIR318, then the
      OwnershipPercentage must not be 0%
    description: >-
      The Ownership Percentage should not be 0% unless the reported ownership
      percentage is in respect of a Non-Group Member.

  - number: 70029
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:Ownership/globe:TIN
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/Ownership/OwnershipType
      - GLOBEBody/GeneralSection/CorporateStructure/UPE/ExcludedUPE/ID/TIN
      - GLOBEBody/GeneralSection/CorporateStructure/UPE/OtherUPE/ID/TIN
    element: TIN
    rule: >-
      When the Ownership Type contains the value of GIR801, then the Ownership/TIN
      provided in the Ownership element must match at least one of the TINs that was
      reported in either the OtherUPE/ID/TIN or ExcludedUPE/ID/TIN
    description: >-
      The ownership type was identified as being the UPE, the TIN of the UPE provided
      at label 1.3.2.1.9 does match the TIN reported at 1.3.1.4. Please ensure that
      the ownership TIN matches to a TIN reported in the corporate structure.

  - number: 70030
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:Ownership/globe:TIN
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/Ownership/OwnershipType
      - GLOBEBody/GeneralSection/CorporateStructure/CE/ID/TIN
    element: TIN
    rule: >-
      When the Ownership Type contains the value of GIR802, GIR803 or GIR804, then the
      Ownership/TIN provided in the Ownership element must match to a TIN that was
      reported in the CE element via the ID/TIN.
    description: >-
      The ownership type was identified as being a CE, JV or JV Subsidiary, the TIN
      provided at label 1.3.2.1.9 does not match to a TIN reported in the corporate
      structure at 1.3.2.1.5. Please ensure that the ownership TIN matches to a TIN
      reported in the corporate structure.

  - number: 70031
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:Ownership/globe:TIN
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/ID/GlobeStatus
      - GLOBEBody/GeneralSection/CorporateStructure/CE/ID/TIN
    element: TIN
    rule: >-
      When the Corporate Structure/CE/ID/GlobeStatus contains the value of GIR305,
      then the Ownership/TIN must be equal at least one TIN of the entity which
      reported the GlobeStatus of GIR306 either in Corporate
      Structure/CE/ID/GlobeStatus, or CorporateStructure/UPE/OtherUPE/ID/GlobeStatus.
    description: >-
      The ownership TIN of a CE identified as being a PE is not held by a CE which is
      a main entity

  - number: 70032
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:QIIR
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/ID/Rules
    element: QIIR
    rule: >-
      When the QIIR element is provided, then the Rules element as provided in the CE
      element must contain either GIR201 or GIR202
    description: >-
      The QIIR element has been provided for a CE which is in a jurisdiction which
      does not have a QIIR selected in the Rules element.

  - number: 70033
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:QIIR/globe:Exception/globe:TIN
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/ID/TIN
    element: TIN
    rule: >-
      The TIN provided must match with a TIN reported for any other CE in the
      CorporateStructure.
    description: >-
      The TIN provided to identify either the POPE or IPE does not match with an
      existing TIN in the corporate structure

  - number: 70034
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:QIIR/globe:Exception/globe:ExceptionRule/globe:Art2.1.3
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/QIIR/POPE-IPE
      - GLOBEBody/GeneralSection/CorporateStructure/CE/QIIR/Exception
    element: Art2.1.3
    rule: >-
      If the POPE-IPE element has the value of 'GIR902-IPE' and the Exception element
      is completed because an exception applies, the Art.2.1.3 element must have the
      status of TRUE
    description: >-
      The exception under article 2.1.3 should be selected in relation to identifying
      another IPE which is required to apply the QIIR

  - number: 70035
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:GeneralSection/globe:CorporateStructure/globe:CE/globe:QIIR/globe:Exception/globe:ExceptionRule/globe:Art2.1.5
    references:
      - GLOBEBody/GeneralSection/CorporateStructure/CE/QIIR/POPE-IPE
      - GLOBEBody/GeneralSection/CorporateStructure/CE/QIIR/Exception
    element: Art2.1.5
    rule: >-
      If the POPE-IPE element has the value of 'GIR901-POPE' and the Exception element
      is completed because an exception applies, the Art.2.1.5 element must have the
      status of TRUE
    description: >-
      The exception under article 2.1.5 should be selected in relation to identifying
      another POPE which is required to apply the QIIR

  - number: 70036
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:Jurisdiction/globe:Subgroup
    rule: >-
      If there is more than one Subgroup per Jurisdiction the whole Summary must be
      repeated. The subgroup element can be different as the computation can be
      different for each subgroup.
    description: >-
      If more than one Subgroup element is provided, then the number of Subgroup
      elements must match the number of Summary sections provided for that
      Jurisdiction. For example, if there are 3 Subgroup elements reported for a
      jurisdiction, then there must be 3 Summary sections for that jurisdiction, each
      one with 3 reported Subgroup elements.

  - number: 70037
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:SubGroup/globe:TIN
    references:
      - GLOBEBody/Summary/Jurisdiction/Subgroup/TIN
      - GLOBEBody/JurisdictionSection/Jurisdiction
    element: Subgroup
    rule: >-
      Where a subgroup element is completed in the 'Summary', then Subgroup element in
      the 'JurisdictionSection' should also be completed. The TIN must match to the
      corresponding TIN in the JurisdictionSection /GLOBETax/ETR/SubGroup. Rule only
      applicable where a JurisdictionSection which relates to the same 'Jurisdiction'
      of the Summary is provided (i.e., where Summary/Jurisdiction/JurisdictionName =
      JurisdictionSection/Jurisdiction).
    description: >-
      The summary section for a jurisdiction indicates that there is a subgroup with a
      separate ETR or Top-up Tax computation, while for the same jurisdiction in the
      Jurisdiction Section, no separate set of subgroup calculations has been
      provided.

  - number: 70038
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:SafeHarbour
    references:
      - MessageSpec/ReportingPeriod
      - GLOBEBody/FilingInfo/Period/End
    element: SafeHarbour
    rule: >-
      When the Reporting Period or Period End Date is later than 30/06/2028, then the
      SafeHarbour element cannot have the input of GIR1203, GIR1204 or GIR1205.
    description: >-
      The Transitional CbCR Safe Harbour has been selected for a reporting fiscal year
      that is beyond the transitional period

  - number: 70039
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:SafeHarbour
    references:
      - MessageSpec/ReportingPeriod
      - GLOBEBody/FilingInfo/Period/End
    element: SafeHarbour
    rule: >-
      When the Reporting Period or Period End Date is later than 31/12/2026, then the
      SafeHarbour element cannot have the input of GIR1206
    description: >-
      The Transitional UTPR Safe Harbour has been selected for a reporting fiscal year
      that is beyond the transitional period.

  - number: 70040
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:SafeHarbour
    references:
      - GLOBEBody/Summary/Jurisdiction/JurisdictionName
      - GLOBEBody/GeneralSection/CorporateStructure/UPE/OtherUPE/ID/ResCountryCode
    element: SafeHarbour
    rule: >-
      The SafeHarbour element can only have the input of GIR1206 in the UPE
      jurisdiction. (i.e., Summary/Jurisdiction/JurisdictionName must be equal to the
      ResCountryCode reported in the UPE ID, so equal to Corporate
      Structure/UPE/OtherUPE/ID/ResCountryCode)
    description: >-
      The Transitional UTPR Safe Harbour has been applied in a jurisdiction which is
      not the UPE Jurisdiction

  - number: 70041
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:SafeHarbour
    references:
      - GLOBEBody/FilingInfo/AccountingInfo/CFSofUPE
    element: SafeHarbour
    rule: >-
      When the FilingInfo CFSofUPE has the input of GIR502 or GIR504, then SafeHarbour
      element cannot have the input of GIR1207, GIR1208 , or GIR1209.
    description: >-
      The Non-material Constituent Entity (NMCE) Simplified Calculations can only be
      completed where the UPE prepares Consolidated Financial Statements as defined by
      paragraphs (a) and (c) of the Consolidated Financial Statements definition in
      Article 10.1.1

  - number: 70042
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary
    test: >-
      not(globe:JurWithTaxingRights and (not(globe:SafeHarbour) or count(globe:SafeHarbour[.!='GIR1206'])=0)) or
      (globe:ETRRange and globe:SBIE and globe:QDMTTut and globe:GLoBETut)
    rule: >-
      If the JurWithTaxingRights element is completed, and the Safe Harbour element is
      not completed or only has the value of GIR1206, then the elements ETRRange,
      SBIE, QDMTTut and GloBETut must be completed
    description: >-
      If one or several jurisdictions have taxing rights, and no Safe Harbour is
      applied or only the UTPR Safe Harbour is applied, then all other elements of the
      summary section must be completed

  - number: 70043
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary
    test: >-
      not(globe:JurWithTaxingRights and globe:SafeHarbour='GIR1202') or
      (globe:ETRRange and globe:SBIE and globe:QDMTTut)
    rule: >-
      If the JurWithTaxingRights element is completed, and the Safe Harbour element
      has the value of GIR1202, then the elements ETRRange, SBIE and QDMTTut must be
      completed
    description: >-
      As a QDMTT SafeHarbour has been applied for the jurisdiction, then all other
      elements except GloBETut of the summary section must be completed

  - number: 70044
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus
    element: ETRStatus
    rule: >-
      When the ETRStatus is completed, it must contain at least one of ETRException or
      ETRComputation.
    description: >-
      Part 2 or Part 3 of the GIR must be completed

  - number: 70045
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR/globe:ETRStatus/globe:ETRException/globe:TransitionalCbCRSafeHarbour
    references:
      - GLOBEBody/Summary/SafeHarbour
      - GLOBEBody/Summary/Jurisdiction
      - GLOBEBody/Summary/Jurisdiction/Subgroup
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/SubGroup
    element: TransitionalCbCRSafeHarbour
    rule: >-
      When the SafeHarbour element has the input of GIR1203, GIR1204 or GIR1205 for a
      jurisdiction (or for a subgroup), then the TransitionalCbCRSafeHarbour element
      for that jurisdiction (or for that subgroup) must be completed (i.e., where the
      Summary/Jurisdiction/JurisdictionName = Jurisdiction Section/Jurisdiction, or if
      Summary/Jurisdiction/Subgroup is completed, then also match where
      Summary/Jurisdiction/Subgroup/TIN = Jurisdiction
      Section/GLoBETax/ETR/SubGroup/TIN)
    description: >-
      A Transitional CbCR Safe Harbour has been selected in the summary section of the
      GIR, but no corresponding TransitionalCbCR element with the relevant CbCR
      calculations for the Tested Jurisdiction has been provided

  - number: 70046
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:JurisdictionSection/globe:GLoBETax/globe:ETR
    test: >-
      not(globe:ETRStatus/globe:ETRException/globe:TransitionalCbCRSafeHarbour) or
      (globe:SubGroup and (globe:SubGroup/globe:TypeofSubGroup='GIR1607' or globe:SubGroup/globe:TypeofSubGroup='GIR1608'))
    rule: >-
      When the TransitionalCbCRSafeHarbour is completed for a jurisdiction, then
      SubGroup element of the ETR must be completed, the TypeofSubGroup must contain
      either GIR1607 or GIR1608.
    description: >-
      The TypeofSubGroup element must be completed and it cannot contain a value other
      than GIR1607 or GIR1608.

  - number: 70047
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:SafeHarbour
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRException/TransitionalCbCRSafeHarbour/Revenue
    element: Revenue
    rule: >-
      When the SafeHarbour element has the input of GIR1203 for a jurisdiction (or for
      a subgroup), then the revenue element must be completed for that jurisdiction
      (or for that subgroup) (i.e., where the Summary/Jurisdiction/JurisdictionName =
      JurisdictionSection/Jurisdiction, or if Summary/Jurisdiction/Subgroup is
      completed, then also match where Summary/Jurisdiction/Subgroup/TIN =
      JurisdictionSection/GLOBETax/ETR/SubGroup/TIN)
    description: >-
      As the Deminimis CbCR safe harbour has been completed, the Revenue element for
      the tested jurisdiction must also be provided

  - number: 70048
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:SafeHarbour
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRException/TransitionalCbCRSafeHarbour/IncomeTax
    element: IncomeTax
    rule: >-
      When the SafeHarbour element has the input of GIR1204 for a jurisdiction (or for
      a subgroup), then the IncomeTax element must be completed for that jurisdiction
      (or for that subgroup) (i.e., where the Summary/Jurisdiction/JurisdictionName =
      JurisdictionSection/Jurisdiction, or if Summary/Jurisdiction/Subgroup is
      completed, then also match where Summary/Jurisdiction/Subgroup/TIN =
      JurisdictionSection/GLOBETax/ETR/SubGroup/TIN)
    description: >-
      As the Simplified ETR Test has been selected for the Tested Jurisdiction, the
      IncomeTax element must also be provided.

  - number: 70049
    targets:
      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:Summary/globe:SafeHarbour
    references:
      - GLOBEBody/JurisdictionSection/GLoBETax/ETR/ETRStatus/ETRException/UTPRSafeHarbour/CITRate
    element: UTPRSafeHarbour
    rule: >-
      When the SafeHarbour element has the input of GIR1206 for a jurisdiction (or for
      a subgroup), then the UTPRSafeHarbour element must be completed for that
      jurisdiction (or for that subgroup). (i.e., where the
