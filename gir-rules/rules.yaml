      - /globe:GLOBE_OECD/globe:GLOBEBody/globe:UTPRAttribution/globe:Attribution/globe:UTPRTopUpTaxCarriedForward
    references:
      - GLOBEBody/UTPRAttribution/Attribution/UTPRTopUpTaxCarryForward
