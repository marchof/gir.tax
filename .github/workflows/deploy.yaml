name: Build and Deploy

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:

  rules-test:
    name: "Test Rules"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Install Python Dependencies
      run: python -m pip install -r gir-rules/requirements.txt
    - name: Test GIR Rules
      run: python gir-rules/test.py

  web-build:
    name: "Web Build"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Dependencies
      run: npm install
    - name: Check Licenses
      run: npm run license-check
    - name: Lint
      run: npm run lint
    - name: Build
      run: npm run build
    - name: Run JavaScript Tests
      run: npm run test
    - name: Upload Distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
      with:
        name: dist
        path: dist

  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs:
      - rules-test
      - web-build
    if: ${{ github.repository == 'marchof/gir.tax' && github.ref == 'refs/heads/main' }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Download Distribution
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
      with:
        name: dist
        path: dist
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::830482727482:role/github-workflow-gir.tax
        aws-region: eu-central-1
    - name: Deploy
      run: aws/deploy.sh
